[project]
name = "my-ansible-linux-setup"
version = "0.1.0"
description = "Docker-based homelab infrastructure using Ansible"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "ansible>=13.7.0",
]

[dependency-groups]
dev = [
    "ansible-lint>=26.4.0",
    "yamllint>=1.38.0",
    "pre-commit>=4.6.0",
]
lint = [
    "ansible-lint>=26.4.0",
    "yamllint>=1.38.0",
]

[tool.uv]
default-groups = ["dev"]
